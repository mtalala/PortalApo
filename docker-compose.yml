version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: apo-postgres
    environment:
      POSTGRES_DB: portalapo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d portalapo"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    image: apo-backend
    container_name: apo-backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/portalapo
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        - EXPO_PUBLIC_API_URL=http://3.85.109.209
    image: apo-frontend
    container_name: apo-frontend
    # Mudança aqui: Força o modo web na porta correta exposta para a rede local/externa
    command: npx expo start --web --host lan
    ports:
      - "8081:8081" # Porta padrão do Expo Web moderno (mude para 80:8081 se quiser acessar direto sem digitar a porta)
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata: